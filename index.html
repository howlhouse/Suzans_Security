<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suzan's Security | Staff Portal</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-base: #121212; --bg-card: #1c1c1f; --teal-primary: #00E5FF;
            --text-main: #f0f0f0; --text-muted: #a0a0a5; --danger: #ff4757; --border: #333338;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
        
        .pride-strip { height: 4px; background: linear-gradient(90deg, #FF0018, #FFA52C, #FFFF41, #008018, #0000F9, #86007D); position: fixed; top: 0; width: 100%; z-index: 1000; }
        header { display: flex; justify-content: space-between; padding: 14px 20px; background: #18181b; border-bottom: 1px solid var(--border); position: sticky; top: 4px; z-index: 900; }
        .brand { font-size: 1.25rem; font-weight: bold; color: var(--teal-primary); }
        .menu-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 1100; }
        .drawer { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: #18181b; z-index: 1200; transition: right 0.3s; padding: 25px 20px; display: flex; flex-direction: column; }
        .drawer.open { right: 0; }
        .nav-item { padding: 14px; color: white; text-align: left; background: none; border: none; font-size: 1rem; cursor: pointer; border-radius: 8px; margin-bottom: 8px; }
        .nav-item:hover, .nav-item.active { background: #27272a; color: var(--teal-primary); }

        .container { max-width: 760px; margin: auto; padding: 20px 16px; }
        .btn { background: var(--teal-primary); color: #121212; padding: 10px 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; color: var(--teal-primary); border: 1px solid var(--teal-primary); }
        .btn-outline:hover { background: var(--teal-primary); color: #121212; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; }
        .input, textarea, select { width: 100%; background: #121212; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; margin: 6px 0 12px; }
        
        .event-tile { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; cursor: pointer; transition: 0.2s; }
        .event-tile:hover { border-color: #555; }
        .event-img { width: 100%; height: 180px; object-fit: cover; }
        .event-body { padding: 18px; }
        
        .tag-badge { display: inline-block; font-size: 0.72rem; padding: 4px 10px; border-radius: 12px; margin: 3px; border: 1px solid #3f3f46; transition: 0.2s; }
        .tag-sel { background: #2ed573 !important; color: #121212 !important; border-color: #2ed573 !important; font-weight: bold; }
        .tag-unsel { background: #27272a !important; color: #a0a0a5 !important; border-color: #3f3f46 !important; }
        
        .draggable-section { border: 1px dashed transparent; padding: 8px; margin-bottom: 6px; border-radius: 6px; cursor: grab; background: #222; }
        .draggable-section.dragging { opacity: 0.5; border-color: var(--teal-primary); }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-day { background: var(--bg-card); min-height: 80px; padding: 6px; font-size: 0.85rem; text-align: right; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
        .cal-event-dot { background: var(--teal-primary); color: #000; font-size: 0.65rem; padding: 2px; border-radius: 4px; text-align: left; margin-top: 2px; white-space: nowrap; overflow: hidden; }
        
        .admin-nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .admin-tab { background: #27272a; color: var(--text-muted); padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; white-space: nowrap; }
        .admin-tab.active { background: var(--teal-primary); color: #121212; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .modal-card { background: var(--bg-card); width: 100%; max-width: 500px; padding: 24px; border-radius: 12px; border: 1px solid var(--border); max-height: 90vh; overflow-y: auto; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        .data-table th, .data-table td { padding: 10px; border-bottom: 1px solid var(--border); }
        
        .detail-box { background: #141416; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
        .guard-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
        .guard-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="pride-strip"></div>
    <header>
        <div class="brand">🏳️‍🌈 SUZAN'S SECURITY</div>
        <div style="display:flex; align-items:center; gap:12px;">
            <span id="userGreeting" style="font-size: 0.85rem; color: var(--text-muted);"></span>
            <button class="menu-btn" onclick="toggleDrawer()">☰</button>
        </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <h3 style="color: var(--teal-primary); margin-bottom: 20px;">Navigation</h3>
        <button class="nav-item active" onclick="switchView('eventsFeed')">🗓️ Event Feed</button>
        <button class="nav-item" onclick="switchView('calendarView')">📅 30-Day Calendar</button>
        <button class="nav-item" onclick="switchView('teamChatView')">💬 Team Channels</button>
        <button class="nav-item" onclick="switchView('blockListView')" style="color: var(--danger);">🚫 Block List</button>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
        <button class="nav-item" style="color: var(--teal-primary);" onclick="promptAdminPin()">🔒 Admin Console</button>
        <button class="nav-item" style="color: var(--danger); margin-top: auto;" onclick="logout()">🚪 Sign Out</button>
    </div>

    <div class="container">
        <!-- USER EVENTS -->
        <section id="eventsFeedView">
            <h2>Upcoming Security Postings</h2>
            <div id="userEventsFeedList" style="margin-top:20px;"></div>
        </section>
        
        <!-- EVENT DETAIL VIEW -->
        <section id="eventDetailView" style="display: none;">
            <button class="btn btn-sm btn-outline" style="margin-bottom:15px;" onclick="switchView('eventsFeed')">← Back to Feed</button>
            <div id="eventDetailContent"></div>
        </section>

        <!-- CALENDAR -->
        <section id="calendarView" style="display: none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <button class="btn btn-sm" onclick="changeMonth(-1)">◀ Prev</button>
                <h3 id="calMonthText" style="color:var(--teal-primary);"></h3>
                <button class="btn btn-sm" onclick="changeMonth(1)">Next ▶</button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </section>

        <!-- CHAT -->
        <section id="teamChatView" style="display: none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h2 id="chatTitle"># general</h2>
                <select id="chatDropdown" class="input" style="width:auto; margin:0;" onchange="switchChat(this.value)"></select>
            </div>
            <div id="chatBox" style="height:350px; overflow-y:auto; background:#141416; padding:15px; border-radius:8px; border:1px solid var(--border); margin-bottom:10px;"></div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="chatInput" class="input" placeholder="Message..." style="margin:0;">
                <button class="btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <button class="btn" onclick="sendChat()">Send</button>
                <input type="file" id="fileInput" style="display:none;" onchange="uploadFile(event)">
            </div>
        </section>

        <!-- BLOCK LIST -->
        <section id="blockListView" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="color:var(--danger);">🚫 Banned Attendees</h2>
                <button class="btn btn-sm btn-danger" onclick="document.getElementById('addBanForm').style.display='block'">+ Add Ban</button>
            </div>
            
            <div id="addBanForm" style="display:none; background:var(--bg-card); padding:15px; border-radius:8px; margin-bottom:20px; border:1px solid var(--danger);">
                <h4 style="color:var(--danger); margin-bottom:10px;">Register New Ban</h4>
                <input type="text" id="banName" class="input" placeholder="Attendee Name or Alias (Required)">
                <textarea id="banNote" class="input" placeholder="Reason for ban / behavioral notes (Required)..."></textarea>
                <input type="text" id="banPic" class="input" placeholder="Optional Image URL">
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-danger" onclick="submitBan()">Save to Block List</button>
                    <button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger);" onclick="document.getElementById('addBanForm').style.display='none'">Cancel</button>
                </div>
            </div>

            <div id="blockListContainer"></div>
        </section>

        <!-- ADMIN CONSOLE -->
        <section id="adminConsoleView" style="display: none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h2 style="color:var(--teal-primary);">Admin Console</h2>
                <button class="btn btn-sm" onclick="switchView('eventsFeed')">Exit</button>
            </div>
            
            <div class="admin-nav">
                <button class="admin-tab active" onclick="switchAdmin('adminEvents')">Events</button>
                <button class="admin-tab" onclick="switchAdmin('adminChats')">Chat Mgmt</button>
                <button class="admin-tab" onclick="switchAdmin('adminLogs')">Logs</button>
                <button class="admin-tab" onclick="switchAdmin('adminUsers')">Users</button>
                <button class="admin-tab" onclick="switchAdmin('adminContacts')">Contacts</button>
                <button class="admin-tab" onclick="switchAdmin('adminSettings')">⚙️</button>
            </div>

            <div id="adminEvents" class="admin-pane">
                <button class="btn btn-sm" style="margin-bottom:15px;" onclick="addBlankEvent()">+ New Event Tile</button>
                <div id="adminEventsList"></div>
            </div>

            <div id="adminChats" class="admin-pane" style="display:none;">
                <div style="display:flex; gap:8px; margin-bottom:15px;">
                    <input type="text" id="newChanInput" class="input" placeholder="New channel..." style="margin:0;">
                    <button class="btn btn-sm" onclick="addChannel()">Add</button>
                </div>
                <h4>Channels</h4><div id="adminChanList" style="margin-bottom:20px;"></div>
                <h4>Specific Messages</h4><div id="adminMsgList" style="margin-bottom:20px; max-height:200px; overflow-y:auto;"></div>
                <h4>Attachments</h4><div id="adminAttachList"></div>
            </div>

            <div id="adminLogs" class="admin-pane" style="display:none;">
                <table class="data-table"><thead><tr><th>Time</th><th>User</th><th>Action</th></tr></thead><tbody id="logsBody"></tbody></table>
            </div>

            <div id="adminUsers" class="admin-pane" style="display:none;">
                <table class="data-table"><thead><tr><th>Name</th><th>Contact</th><th>Role/Reset</th></tr></thead><tbody id="usersBody"></tbody></table>
            </div>

            <div id="adminContacts" class="admin-pane" style="display:none;">
                <button class="btn btn-sm" style="margin-bottom:15px;" onclick="addPromoter()">+ New Promoter</button>
                <div id="promoterList"></div>
            </div>

            <div id="adminSettings" class="admin-pane" style="display:none;">
                <label>Change Console PIN</label>
                <input type="password" id="newPinInput" class="input" placeholder="New PIN">
                <button class="btn btn-sm" onclick="changePin()">Save PIN</button>
            </div>
        </section>
    </div>

    <!-- MODALS -->
    <div class="modal" id="authModal">
        <div class="modal-card">
            <h3 style="text-align:center; color:var(--teal-primary);">Staff Login</h3>
            <p id="authErr" style="color:var(--danger); display:none;"></p>
            <input type="email" id="authEmail" class="input" placeholder="Email">
            <input type="password" id="authPass" class="input" placeholder="Password">
            <div id="regFields" style="display:none;">
                <input type="text" id="authName" class="input" placeholder="Full Name">
                <input type="tel" id="authPhone" class="input" placeholder="Phone">
            </div>
            <button class="btn" style="width:100%;" id="authBtn" onclick="handleAuth()">Sign In</button>
            <p style="text-align:center; margin-top:15px; color:var(--teal-primary); cursor:pointer;" onclick="toggleAuth()">Need an account? Register</p>
        </div>
    </div>

    <div class="modal" id="promoterModal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between;">
                <h3 id="pName"></h3><button class="btn btn-sm btn-danger" onclick="closeModal('promoterModal')">X</button>
            </div>
            <p id="pContact" style="font-size:0.85rem; margin-bottom:10px;"></p>
            <div id="pTags" style="margin-bottom:10px;"></div>
            <div style="display:flex; gap:6px; margin-bottom:15px;">
                <input type="text" id="pTagIn" class="input" placeholder="Add tag..." style="margin:0;"><button class="btn btn-sm" onclick="addPTag()">Add</button>
            </div>
            <h4>Journal</h4>
            <div id="pNotes" style="background:#121212; padding:10px; border-radius:6px; margin-bottom:10px; max-height:150px; overflow-y:auto;"></div>
            <textarea id="pNoteIn" placeholder="Add note..."></textarea>
            <button class="btn btn-sm" onclick="addPNote()">Post</button>
        </div>
    </div>

    <script>
        const PRESET_TAGS = ['SFW', 'NSFW', '18+', 'Bar', 'Club', 'Dungeon', 'Warehouse', 'Residential', 'Commercial', 'Kink', 'Sober', 'WatchDog', 'Themed'];
        const GUARD_POSTS = ['Unassigned', 'Person/Bag Check', 'ID Check', 'Ticket', 'Float', 'Play Guard', 'Dancefloor', 'Bar', 'Parking Lot', 'Other'];
        
        function initDB() {
            if(!localStorage.getItem('ss_pin')) localStorage.setItem('ss_pin', '0000');
            if(!localStorage.getItem('ss_users')) localStorage.setItem('ss_users', JSON.stringify([{id:'u1', name:'Admin Suzan', email:'admin@suzan.com', phone:'555-0000', password:'admin', isAdmin:true}]));
            if(!localStorage.getItem('ss_channels')) localStorage.setItem('ss_channels', JSON.stringify(['general']));
            if(!localStorage.getItem('ss_chats')) localStorage.setItem('ss_chats', JSON.stringify([]));
            if(!localStorage.getItem('ss_promoters')) localStorage.setItem('ss_promoters', JSON.stringify([{id:'p1', name:'Dax Valentine', phone:'555-1234', email:'dax@club.com', tags:['VIP'], notes:[{date:'2026-09-08', text:'Great payer.'}]}]));
            if(!localStorage.getItem('ss_logs')) localStorage.setItem('ss_logs', JSON.stringify([]));
            if(!localStorage.getItem('ss_blocklist')) localStorage.setItem('ss_blocklist', JSON.stringify([{id:'b1', name:'"Sticky Fingers" Mike', note:'Caught stealing from the tip bucket.', pic:'', addedBy:'System', date:'9/8/2026'}]));

            if(!localStorage.getItem('ss_events')) {
                localStorage.setItem('ss_events', JSON.stringify([{id:'e1', title:'Neon Circuit', date:'2026-09-15', venueName:'The Compound', venueAddress:'123 S 4th Ave, Phoenix, AZ', parkingDetails:'Park in the rear alley gated lot.', tags:['NSFW', 'Club'], desc:'Main door watch.', openSlots:2, guards:[], guardPosts:{}, promoterId:'p1', image:'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600', layout:['img','info','tags','roster'], ticketLink:''}]));
            } else {
                let evs = JSON.parse(localStorage.getItem('ss_events'));
                let needsFix = false;
                evs = evs.map(e => {
                    if (e.venueName === undefined || e.venueAddress === undefined || e.parkingDetails === undefined) {
                        needsFix = true;
                        e.venueName = e.venueName || '';
                        e.venueAddress = e.venueAddress || '';
                        e.parkingDetails = e.parkingDetails || '';
                    }
                    return e;
                });
                if (needsFix) localStorage.setItem('ss_events', JSON.stringify(evs));
            }
        }
        initDB();

        const getDB = k => JSON.parse(localStorage.getItem('ss_'+k));
        const setDB = (k,v) => localStorage.setItem('ss_'+k, JSON.stringify(v));
        const logAction = act => setDB('logs', [{time:new Date().toLocaleTimeString(), user:currUser()?.name||'System', action:act}, ...getDB('logs')]);

        let isReg = false;
        const currUser = () => JSON.parse(localStorage.getItem('ss_session'));
        
        function checkAuth() {
            if(!currUser()) document.getElementById('authModal').style.display='flex';
            else { document.getElementById('authModal').style.display='none'; document.getElementById('userGreeting').innerText = '🛡️ ' + currUser().name; renderEvents(); }
        }
        function toggleAuth() { isReg = !isReg; document.getElementById('regFields').style.display = isReg ? 'block' : 'none'; document.getElementById('authBtn').innerText = isReg ? 'Register' : 'Sign In'; }
        function handleAuth() {
            const email = document.getElementById('authEmail').value, pass = document.getElementById('authPass').value;
            let users = getDB('users');
            if(isReg) {
                const name = document.getElementById('authName').value, phone = document.getElementById('authPhone').value;
                const nu = {id:'u'+Date.now(), name, email, phone, password:pass, isAdmin:false};
                users.push(nu); setDB('users', users); localStorage.setItem('ss_session', JSON.stringify(nu)); logAction('Registered new user');
            } else {
                const u = users.find(x => x.email===email && x.password===pass);
                if(u) { localStorage.setItem('ss_session', JSON.stringify(u)); logAction('Logged in'); } else return alert('Invalid creds');
            }
            checkAuth();
        }
        function logout() { logAction('Logged out'); localStorage.removeItem('ss_session'); location.reload(); }

        function toggleDrawer() { const d = document.getElementById('drawer'); d.classList.toggle('open'); document.getElementById('drawerOverlay').style.display = d.classList.contains('open') ? 'block':'none'; }
        
        function switchView(v) { 
            ['eventsFeedView','eventDetailView','calendarView','teamChatView','blockListView','adminConsoleView'].forEach(id => {
                document.getElementById(id).style.display = id===v+'View'||id===v ? 'block':'none';
            }); 
            if(document.getElementById('drawer').classList.contains('open')) toggleDrawer(); 
            if(v==='eventsFeed')renderEvents();
            if(v==='calendarView')renderCal(); 
            if(v==='teamChatView')renderChat(); 
            if(v==='adminConsoleView')renderAdminEv(); 
            if(v==='blockListView')renderBlockList();
        }

        // --- USER EVENTS FEED ---
        function renderEvents() {
            const evs = getDB('events').sort((a,b)=>new Date(a.date)-new Date(b.date));
            const u = currUser();
            document.getElementById('userEventsFeedList').innerHTML = evs.map(e => `
                <div class="event-tile" onclick="if(event.target.tagName !== 'BUTTON') openEventDetail('${e.id}')">
                    <img src="${e.image}" class="event-img">
                    <div class="event-body">
                        <h3 style="color:var(--teal-primary);">${e.title}</h3>
                        <p style="font-size:0.85rem; color:#888; margin-bottom:4px;">🗓️ ${e.date}</p>
                        ${e.venueName ? `<p style="font-size:0.85rem; color:var(--teal-primary); margin-bottom:8px;">📍 ${e.venueName} — ${e.venueAddress}</p>` : ''}
                        <div style="margin-bottom:10px;">${e.tags.map(t=>`<span class="tag-badge tag-sel">${t}</span>`).join('')}</div>
                        <div style="background:#141416; padding:10px; border-radius:6px; margin-bottom:10px; font-size:0.85rem;">
                            <strong style="color:var(--teal-primary);">Roster (${e.openSlots} open):</strong><br>
                            ${e.guards.join(', ') || 'No one signed up yet'}
                        </div>
                        <button class="btn" style="width:100%;" onclick="toggleSignUp('${e.id}', event)" ${e.openSlots===0 && !e.guards.includes(u.name) ? 'disabled':''}>
                            ${e.guards.includes(u.name) ? 'Cancel My Shift' : (e.openSlots===0 ? 'Full' : 'Claim Shift')}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleSignUp(id, eEvent = null) {
            if(eEvent) eEvent.stopPropagation();
            let evs = getDB('events'), e = evs.find(x=>x.id===id), u = currUser();
            if(e.guards.includes(u.name)) { 
                e.guards = e.guards.filter(g=>g!==u.name); 
                delete e.guardPosts[u.name];
                e.openSlots++; 
                logAction(`Dropped shift: ${e.title}`); 
            } else { 
                e.guards.push(u.name); 
                e.guardPosts[u.name] = 'Unassigned';
                e.openSlots--; 
                logAction(`Claimed shift: ${e.title}`); 
            }
            setDB('events', evs); 
            if (activeDetailId === id) renderEventDetail(id);
            else renderEvents();
        }

        // --- EVENT DETAIL VIEW ---
        let activeDetailId = null;
        function openEventDetail(id) {
            activeDetailId = id;
            switchView('eventDetail');
            renderEventDetail(id);
        }

        function renderEventDetail(id) {
            const e = getDB('events').find(x=>x.id===id);
            const u = currUser();
            const promoters = getDB('promoters');
            const promoter = promoters.find(p => p.id === e.promoterId);
            const isSignedUp = e.guards.includes(u.name);

            let rosterHtml = e.guards.map(g => {
                if (g === u.name) {
                    return `
                    <div class="guard-row">
                        <span>🛡️ <strong>${g}</strong> (You)</span>
                        <select class="input" style="width:auto; margin:0; padding:4px;" onchange="updateGuardPost('${e.id}', '${g}', this.value)">
                            ${GUARD_POSTS.map(post => `<option value="${post}" ${(e.guardPosts[g]||'Unassigned') === post ? 'selected' : ''}>${post}</option>`).join('')}
                        </select>
                    </div>`;
                } else {
                    return `<div class="guard-row"><span>🛡️ ${g}</span> <span style="color:var(--teal-primary); font-size:0.8rem;">${e.guardPosts[g]||'Unassigned'}</span></div>`;
                }
            }).join('') || '<p style="font-size:0.85rem; color:#888;">No guards claimed this post yet.</p>';

            document.getElementById('eventDetailContent').innerHTML = `
                <img src="${e.image}" style="width:100%; height:200px; object-fit:cover; border-radius:8px; margin-bottom:15px;">
                <h2 style="color:var(--teal-primary);">${e.title}</h2>
                <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:6px;">🗓️ ${e.date}</p>
                ${e.venueName ? `
                <div class="detail-box" style="border-color:var(--teal-primary);">
                    <h4 style="color:var(--teal-primary); margin-bottom:4px;">📍 Venue Details</h4>
                    <p style="font-weight:bold; font-size:0.95rem;">${e.venueName}</p>
                    <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px;">${e.venueAddress}</p>
                    ${e.parkingDetails ? `<p style="font-size:0.85rem; color:var(--text-muted);">🚗 <strong>Parking:</strong> ${e.parkingDetails}</p>` : ''}
                </div>` : ''}
                
                <div style="margin-bottom:15px;">${e.tags.map(t=>`<span class="tag-badge tag-sel">${t}</span>`).join('')}</div>
                ${e.ticketLink ? `<a href="${e.ticketLink}" target="_blank" class="btn btn-outline" style="display:block; text-align:center; text-decoration:none; margin-bottom:15px; width:100%;">🎟️ Buy / Check Tickets</a>` : ''}
                
                <div class="detail-box">
                    <h4 style="color:var(--teal-primary); margin-bottom:8px;">Operational Brief</h4>
                    <p style="font-size:0.9rem;">${e.desc || 'No brief provided.'}</p>
                </div>

                ${promoter ? `
                <div class="detail-box">
                    <h4 style="color:var(--teal-primary); margin-bottom:8px;">Promoter / Client Info</h4>
                    <p style="font-size:0.9rem; font-weight:bold;">${promoter.name}</p>
                    <p style="font-size:0.85rem; color:var(--text-muted);">📞 ${promoter.phone} | ✉️ ${promoter.email}</p>
                </div>` : ''}

                <div class="detail-box">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h4 style="color:var(--teal-primary);">Guard Deployment (${e.openSlots} Open)</h4>
                        <button class="btn btn-sm" onclick="toggleSignUp('${e.id}')" ${e.openSlots===0 && !isSignedUp ? 'disabled':''}>
                            ${isSignedUp ? 'Cancel Shift' : (e.openSlots===0 ? 'Full' : 'Claim Shift')}
                        </button>
                    </div>
                    ${rosterHtml}
                </div>

                <div class="detail-box">
                    <h4 style="color:var(--teal-primary); margin-bottom:10px;">Event Communications</h4>
                    <div id="detailChatBox" style="height:250px; overflow-y:auto; background:#1e1e24; padding:10px; border-radius:6px; margin-bottom:10px; border:1px solid #333;"></div>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="detailChatInput" class="input" placeholder="Message team..." style="margin:0;">
                        <button class="btn btn-sm" onclick="sendDetailChat('${e.id}')">Send</button>
                    </div>
                </div>
            `;
            renderDetailChat(e.id);
        }

        function updateGuardPost(eventId, guardName, postVal) {
            let evs = getDB('events');
            let e = evs.find(x => x.id === eventId);
            if(e) {
                e.guardPosts[guardName] = postVal;
                setDB('events', evs);
                logAction(`Updated post for ${guardName} to ${postVal} on ${e.title}`);
            }
        }

        function renderDetailChat(eventId) {
            const chanName = 'evt_' + eventId;
            const msgs = getDB('chats').filter(c => c.channel === chanName);
            const box = document.getElementById('detailChatBox');
            if(!box) return;
            box.innerHTML = msgs.map(c => `
                <div style="margin-bottom:6px; background:#2a2a30; padding:6px; border-radius:6px; font-size:0.85rem;">
                    <strong style="color:var(--teal-primary);">${c.user}:</strong> ${c.text}
                </div>
            `).join('') || '<p style="color:#666; font-size:0.8rem; text-align:center;">No messages for this event yet.</p>';
            box.scrollTop = box.scrollHeight;
        }

        function sendDetailChat(eventId) {
            const input = document.getElementById('detailChatInput');
            const v = input.value.trim();
            if(v) {
                let ch = getDB('chats');
                ch.push({id:'m'+Date.now(), channel: 'evt_' + eventId, user: currUser().name, text: v, file: null});
                setDB('chats', ch);
                input.value = '';
                renderDetailChat(eventId);
            }
        }

        // --- CALENDAR ---
        let calD = new Date(2026, 8, 1);
        function changeMonth(d) { calD.setMonth(calD.getMonth()+d); renderCal(); }
        function renderCal() {
            document.getElementById('calMonthText').innerText = calD.toLocaleString('default', {month:'long', year:'numeric'});
            const grid = document.getElementById('calGrid'); grid.innerHTML = '';
            const evs = getDB('events'), days = new Date(calD.getFullYear(), calD.getMonth()+1, 0).getDate(), first = new Date(calD.getFullYear(), calD.getMonth(), 1).getDay();
            ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => grid.innerHTML += `<div style="color:var(--teal-primary); font-size:0.8rem; font-weight:bold;">${d}</div>`);
            for(let i=0; i<first; i++) grid.innerHTML += `<div></div>`;
            for(let i=1; i<=days; i++) {
                const dateStr = `${calD.getFullYear()}-${String(calD.getMonth()+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const dayEvs = evs.filter(e => e.date === dateStr);
                grid.innerHTML += `<div class="cal-day" onclick="if(${dayEvs.length}>0) openEventDetail('${dayEvs[0].id}')">
                    ${i} ${dayEvs.map(e=>`<div class="cal-event-dot">${e.title}</div>`).join('')}
                </div>`;
            }
        }

        // --- BLOCK LIST ---
        function renderBlockList() {
            const list = getDB('blocklist') || [];
            const container = document.getElementById('blockListContainer');
            const isAdmin = currUser()?.isAdmin;
            
            container.innerHTML = list.map(b => `
                <div class="event-tile" style="border-color:var(--danger); padding:15px; display:flex; gap:15px; align-items:center;">
                    ${b.pic ? `<img src="${b.pic}" style="width:80px; height:80px; border-radius:8px; object-fit:cover;">` : `<div style="width:80px; height:80px; border-radius:8px; background:#27272a; display:flex; align-items:center; justify-content:center; font-size:2rem;">👤</div>`}
                    <div style="flex:1;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <h3 style="color:var(--danger); margin-bottom:4px;">${b.name}</h3>
                            ${isAdmin ? `<button class="btn btn-sm" style="background:transparent; color:var(--text-muted); font-size:1.2rem; padding:0;" onclick="deleteBan('${b.id}')">×</button>` : ''}
                        </div>
                        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:8px;">Reported by ${b.addedBy} on ${b.date}</p>
                        <p style="font-size:0.9rem;">${b.note}</p>
                    </div>
                </div>
            `).join('') || '<p style="color:var(--text-muted); text-align:center;">No attendees currently banned.</p>';
        }

        function submitBan() {
            const name = document.getElementById('banName').value.trim();
            const note = document.getElementById('banNote').value.trim();
            const pic = document.getElementById('banPic').value.trim();
            if(!name || !note) return alert("Please provide both a name/alias and a reason for the ban.");

            const list = getDB('blocklist') || [];
            list.unshift({ id: 'b' + Date.now(), name, note, pic, addedBy: currUser().name, date: new Date().toLocaleDateString() });
            setDB('blocklist', list);
            logAction(`Added attendee to block list: ${name}`);
            
            document.getElementById('banName').value = ''; document.getElementById('banNote').value = ''; document.getElementById('banPic').value = '';
            document.getElementById('addBanForm').style.display = 'none';
            renderBlockList();
        }

        function deleteBan(id) {
            if(confirm("Remove this attendee from the block list?")) {
                let list = getDB('blocklist') || [];
                setDB('blocklist', list.filter(b => b.id !== id));
                logAction(`Removed attendee from block list`);
                renderBlockList();
            }
        }

        // --- ADMIN SECURE ---
        function promptAdminPin() {
            if(prompt('Enter Admin PIN:') === (localStorage.getItem('ss_pin')||'0000')) switchView('adminConsoleView');
            else alert('Invalid PIN');
        }
        function switchAdmin(t) { document.querySelectorAll('.admin-tab').forEach(el=>el.classList.remove('active')); event.target.classList.add('active'); document.querySelectorAll('.admin-pane').forEach(el=>el.style.display='none'); document.getElementById(t).style.display='block'; if(t==='adminEvents')renderAdminEv(); if(t==='adminChats')renderAdminChats(); if(t==='adminLogs')renderLogs(); if(t==='adminUsers')renderUsers(); if(t==='adminContacts')renderContacts(); }

        // --- ADMIN EVENTS (DRAG/DROP) ---
        function renderAdminEv() {
            const evs = getDB('events').sort((a,b)=>new Date(a.date)-new Date(b.date));
            document.getElementById('adminEventsList').innerHTML = evs.map(e => `
                <div class="event-tile" style="padding:15px;" id="tile_${e.id}">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="color:var(--teal-primary); font-weight:bold;">Manage Deployment: ${e.title}</span>
                        <button class="btn btn-sm btn-danger" onclick="delEv('${e.id}')">Delete Event</button>
                    </div>
                    <div id="drag_${e.id}" class="drag-container">
                        ${e.layout.map(sec => genAdminSec(sec, e)).join('')}
                    </div>
                </div>
            `).join('');
            evs.forEach(e => initDragDrop(`drag_${e.id}`, e.id));
        }
        function genAdminSec(sec, e) {
            const promoters = getDB('promoters');
            const promOpts = `<option value="">-- No Client/Promoter Linked --</option>` + promoters.filter(p => !p.archived).map(p => `<option value="${p.id}" ${e.promoterId === p.id ? 'selected' : ''}>${p.name}</option>`).join('');

            if(sec==='img') return `<div class="draggable-section" draggable="true" data-id="img"><label style="font-size:0.8rem;color:var(--teal-primary);">IMAGE URL & TITLE</label><input class="input" value="${e.image}" placeholder="Image URL" onchange="updEv('${e.id}','image',this.value)"><input class="input" value="${e.title}" placeholder="Event Title" onchange="updEv('${e.id}','title',this.value)"></div>`;
            if(sec==='info') return `<div class="draggable-section" draggable="true" data-id="info"><label style="font-size:0.8rem;color:var(--teal-primary);">VENUE, ADDRESS, PARKING & BRIEF</label><input type="date" class="input" value="${e.date}" onchange="updEv('${e.id}','date',this.value)"><input type="text" class="input" placeholder="Business / Venue Name" value="${e.venueName||''}" onchange="updEv('${e.id}','venueName',this.value)"><input type="text" class="input" placeholder="Street Address" value="${e.venueAddress||''}" onchange="updEv('${e.id}','venueAddress',this.value)"><input type="text" class="input" placeholder="Parking Details (e.g. rear lot access)" value="${e.parkingDetails||''}" onchange="updEv('${e.id}','parkingDetails',this.value)"><select class="input" onchange="updEv('${e.id}','promoterId',this.value)">${promOpts}</select><textarea class="input" placeholder="Event Description..." onchange="updEv('${e.id}','desc',this.value)">${e.desc}</textarea><input type="text" class="input" placeholder="Ticket URL (optional)" value="${e.ticketLink||''}" onchange="updEv('${e.id}','ticketLink',this.value)"></div>`;
            if(sec==='tags') return `<div class="draggable-section" draggable="true" data-id="tags"><label style="font-size:0.8rem;color:var(--teal-primary);">TAGS (Click to toggle)</label><div style="margin-top:6px;">${PRESET_TAGS.map(t=>`<span class="tag-badge ${e.tags.includes(t)?'tag-sel':'tag-unsel'}" style="cursor:pointer;" onclick="togTag('${e.id}','${t}')">${t}</span>`).join('')}</div></div>`;
            if(sec==='roster') return `<div class="draggable-section" draggable="true" data-id="roster"><div style="display:flex; justify-content:space-between; align-items:center;"><label style="font-size:0.8rem;color:var(--teal-primary);">ROSTER & SLOTS</label><div><label style="font-size:0.8rem;">Open Slots:</label> <input type="number" class="input" style="width:60px; padding:4px; margin:0;" value="${e.openSlots}" onchange="updEv('${e.id}','openSlots',parseInt(this.value)||0); renderAdminEv();"></div></div><div style="display:flex; gap:5px; margin-top:10px;"><input id="mg_${e.id}" class="input" placeholder="Manual Name" style="margin:0;"><button class="btn btn-sm" onclick="manAddG('${e.id}')">Add Guard</button></div><p style="font-size:0.8rem; margin-top:8px; color:var(--text-muted);">Assigned Guards: ${e.guards.map((g,i)=>`${g} <b style="color:red;cursor:pointer;margin-left:4px;" onclick="rmG('${e.id}',${i})">×</b>`).join(' | ')}</p></div>`;
        }
        function initDragDrop(cid, eid) {
            const cont = document.getElementById(cid);
            cont.querySelectorAll('.draggable-section').forEach(dr => {
                dr.addEventListener('dragstart', () => dr.classList.add('dragging'));
                dr.addEventListener('dragend', () => { dr.classList.remove('dragging'); updEv(eid, 'layout', [...cont.children].map(c=>c.dataset.id)); });
            });
            cont.addEventListener('dragover', e => {
                e.preventDefault(); const drg = cont.querySelector('.dragging');
                const aft = [...cont.querySelectorAll('.draggable-section:not(.dragging)')].find(c => e.clientY <= c.getBoundingClientRect().top + c.offsetHeight/2);
                aft ? cont.insertBefore(drg, aft) : cont.appendChild(drg);
            });
        }
        function updEv(id, f, v) { let evs=getDB('events'), e=evs.find(x=>x.id===id); e[f]=v; setDB('events',evs); }
        function togTag(id, t) { let evs=getDB('events'), e=evs.find(x=>x.id===id); e.tags.includes(t)?e.tags=e.tags.filter(x=>x!==t):e.tags.push(t); setDB('events',evs); renderAdminEv(); }
        function manAddG(id) { let evs=getDB('events'), e=evs.find(x=>x.id===id), v=document.getElementById('mg_'+id).value; if(!v)return; e.guards.push(v); e.guardPosts[v] = 'Unassigned'; if(e.openSlots>0)e.openSlots--; setDB('events',evs); renderAdminEv(); }
        function rmG(id, i) { let evs=getDB('events'), e=evs.find(x=>x.id===id); const gName = e.guards[i]; e.guards.splice(i,1); delete e.guardPosts[gName]; e.openSlots++; setDB('events',evs); renderAdminEv(); }
        function addBlankEvent() { let evs=getDB('events'); evs.unshift({id:'e'+Date.now(), title:'New Event', date:'2026-09-01', venueName:'', venueAddress:'', parkingDetails:'', tags:[], desc:'', openSlots:1, guards:[], guardPosts:{}, promoterId:'', image:'', layout:['img','info','tags','roster'], ticketLink:''}); setDB('events',evs); renderAdminEv(); }
        function delEv(id) { setDB('events', getDB('events').filter(e=>e.id!==id)); renderAdminEv(); }

        // --- ADMIN CHAT ---
        function renderAdminChats() {
            const ch = getDB('channels'), msgs = getDB('chats');
            document.getElementById('adminChanList').innerHTML = ch.map(c=>`<div style="display:flex;justify-content:space-between;background:#222;padding:8px;margin-bottom:5px;"><span># ${c}</span><div><button class="btn btn-sm btn-danger" onclick="delChan('${c}')">Del Chan</button> <button class="btn btn-sm btn-danger" onclick="clrChan('${c}')">Clr Hist</button></div></div>`).join('');
            document.getElementById('adminMsgList').innerHTML = msgs.map(m=>`<div style="display:flex;justify-content:space-between;background:#222;padding:5px;margin-bottom:2px;font-size:0.8rem;"><span>[#${m.channel}] ${m.user}: ${m.text}</span><button style="color:red;background:none;border:none;cursor:pointer;" onclick="delMsg('${m.id}')">X</button></div>`).join('');
            document.getElementById('adminAttachList').innerHTML = msgs.filter(m=>m.file).map(m=>`<div style="background:#222;padding:5px;"><a href="${m.file}" style="color:var(--teal-primary);">📎 In #${m.channel}</a></div>`).join('');
        }
        function addChannel() { let ch=getDB('channels'), v=document.getElementById('newChanInput').value; if(v&&!ch.includes(v)){ch.push(v); setDB('channels',ch); renderAdminChats();} }
        function delChan(c) { setDB('channels', getDB('channels').filter(x=>x!==c)); setDB('chats', getDB('chats').filter(x=>x.channel!==c)); renderAdminChats(); }
        function clrChan(c) { setDB('chats', getDB('chats').filter(x=>x.channel!==c)); renderAdminChats(); }
        function delMsg(id) { setDB('chats', getDB('chats').filter(x=>x.id!==id)); renderAdminChats(); }

        // --- LOGS, USERS, CONTACTS ---
        function renderLogs() { document.getElementById('logsBody').innerHTML = getDB('logs').map(l=>`<tr><td>${l.time}</td><td style="color:var(--teal-primary);">${l.user}</td><td>${l.action}</td></tr>`).join(''); }
        function renderUsers() { document.getElementById('usersBody').innerHTML = getDB('users').map(u=>`<tr><td>${u.name}</td><td>${u.email}<br>${u.phone}</td><td><button class="btn btn-sm" onclick="togAdmin('${u.id}')">${u.isAdmin?'Admin':'Guard'}</button> <button class="btn btn-sm btn-danger" onclick="rstPass('${u.id}')">Reset Pass</button></td></tr>`).join(''); }
        function togAdmin(id) { let u=getDB('users'), usr=u.find(x=>x.id===id); usr.isAdmin=!usr.isAdmin; setDB('users',u); renderUsers(); }
        function rstPass(id) { let np=prompt('New Pass:'); if(np){let u=getDB('users'), usr=u.find(x=>x.id===id); usr.password=np; setDB('users',u); alert('Reset!');} }
        
        let selP = null;
        function renderContacts() { document.getElementById('promoterList').innerHTML = getDB('promoters').filter(p=>!p.archived).map(p=>`<div class="event-tile" style="padding:10px; cursor:pointer;" onclick="openP('${p.id}')"><h4 style="color:var(--teal-primary);">${p.name}</h4><div style="font-size:0.8rem;">${p.tags.join(', ')}</div></div>`).join(''); }
        function addPromoter() { let pr=getDB('promoters'); pr.push({id:'p'+Date.now(), name:prompt('Name:'), phone:prompt('Phone:'), email:prompt('Email:'), tags:[], notes:[], archived:false}); setDB('promoters',pr); renderContacts(); }
        function openP(id) { selP=id; let p=getDB('promoters').find(x=>x.id===id); document.getElementById('pName').innerText=p.name; document.getElementById('pContact').innerText=`📞 ${p.phone} | ✉️ ${p.email}`; document.getElementById('pTags').innerHTML=p.tags.map((t,i)=>`<span class="tag-badge tag-sel">${t} <b style="color:red;cursor:pointer;margin-left:4px;" onclick="rmPTag(${i})">×</b></span>`).join(''); document.getElementById('pNotes').innerHTML=p.notes.map(n=>`<div style="border-bottom:1px solid #333; padding:5px 0;"><small style="color:var(--teal-primary);">${n.date}</small><br>${n.text}</div>`).join(''); document.getElementById('promoterModal').style.display='flex'; }
        function addPTag() { let p=getDB('promoters'), pr=p.find(x=>x.id===selP), v=document.getElementById('pTagIn').value; if(v){pr.tags.push(v); setDB('promoters',p); openP(selP);} }
        function rmPTag(i) { let p=getDB('promoters'), pr=p.find(x=>x.id===selP); pr.tags.splice(i,1); setDB('promoters',p); openP(selP); }
        function addPNote() { let p=getDB('promoters'), pr=p.find(x=>x.id===selP), v=document.getElementById('pNoteIn').value; if(v){pr.notes.unshift({date:new Date().toLocaleDateString(), text:v}); setDB('promoters',p); openP(selP);} }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function changePin() { let np=document.getElementById('newPinInput').value; if(np){localStorage.setItem('ss_pin',np); alert('PIN Saved');} }

        // --- NORMAL CHAT ---
        let actChan = 'general';
        function renderChat() { document.getElementById('chatDropdown').innerHTML = getDB('channels').map(c=>`<option value="${c}" ${c===actChan?'selected':''}>#${c}</option>`).join(''); document.getElementById('chatTitle').innerText = '# '+actChan; document.getElementById('chatBox').innerHTML = getDB('chats').filter(c=>c.channel===actChan).map(c=>`<div style="margin-bottom:8px; background:#222; padding:8px; border-radius:6px; font-size:0.9rem;"><strong style="color:var(--teal-primary);">${c.user}:</strong> ${c.text} ${c.file?`<br><a href="${c.file}" style="color:var(--teal-primary); font-size:0.8rem;">📎 Attachment</a>`:''}</div>`).join(''); }
        function switchChat(c) { actChan=c; renderChat(); }
        function sendChat(fUrl=null) { let v=document.getElementById('chatInput').value; if(v||fUrl){let ch=getDB('chats'); ch.push({id:'m'+Date.now(), channel:actChan, user:currUser().name, text:v||'Sent file', file:fUrl}); setDB('chats',ch); document.getElementById('chatInput').value=''; renderChat();} }
        function uploadFile(e) { if(e.target.files[0]) sendChat(URL.createObjectURL(e.target.files[0])); }

        checkAuth();
    </script>
</body>
</html>
