<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suzan's Security | Command Center</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Apple HIG & Phoenix Neon Desert Theme */
        :root {
            --bg-base: #08080c; 
            --bg-card: rgba(28, 28, 31, 0.65); 
            --teal-primary: #00E5FF;
            --sunset-magenta: #FF007F;
            --desert-green: #39FF14;
            --text-main: #f0f0f0; 
            --text-muted: #a0a0a5; 
            --danger: #ff4757; 
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-base); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; -webkit-font-smoothing: antialiased; }
        
        .pride-strip { height: 4px; background: linear-gradient(90deg, var(--sunset-magenta), var(--teal-primary), var(--desert-green)); position: fixed; top: 0; width: 100%; z-index: 1000; }
        header { display: flex; justify-content: space-between; padding: 16px 20px; background: rgba(8, 8, 12, 0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); position: sticky; top: 4px; z-index: 900; }
        .brand { font-size: 1.3rem; font-weight: 800; background: -webkit-linear-gradient(45deg, var(--teal-primary), var(--sunset-magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .menu-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .menu-btn:active { transform: scale(0.9); }

        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: none; z-index: 1100; }
        .drawer { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(28, 28, 31, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 1200; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding: 25px 20px; display: flex; flex-direction: column; border-left: 1px solid var(--border); }
        .drawer.open { right: 0; }
        .nav-item { padding: 14px; color: white; text-align: left; background: none; border: none; font-size: 1.05rem; cursor: pointer; border-radius: 12px; margin-bottom: 8px; transition: 0.2s; font-weight: 500; }
        .nav-item:hover, .nav-item.active { background: rgba(0, 229, 255, 0.1); color: var(--teal-primary); }

        .container { max-width: 800px; margin: auto; padding: 20px 16px; }
        .btn { background: var(--teal-primary); color: #08080c; padding: 12px 18px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        .btn:active { transform: scale(0.96); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; color: var(--teal-primary); border: 1px solid var(--teal-primary); }
        .btn-outline:hover { background: var(--teal-primary); color: #08080c; }
        .btn-sm { padding: 8px 12px; font-size: 0.8rem; }
        .input, textarea, select { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 10px; margin: 6px 0 14px; font-size: 1rem; transition: 0.2s; }
        .input:focus { border-color: var(--teal-primary); outline: none; }
        
        .event-tile { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer; }
        .event-tile:active { transform: scale(0.98); }
        .event-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--border); }
        .event-body { padding: 20px; }
        
        .tag-badge { display: inline-block; font-size: 0.75rem; padding: 6px 12px; border-radius: 20px; margin: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag-sel { background: rgba(57, 255, 20, 0.15); color: var(--desert-green); border: 1px solid var(--desert-green); }
        .tag-unsel { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); }
        
        .admin-nav { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch; }
        .admin-tab { background: rgba(255,255,255,0.05); color: var(--text-muted); padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; white-space: nowrap; font-weight: 600; transition: 0.2s; }
        .admin-tab.active { background: var(--teal-primary); color: #08080c; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
        .modal-card { background: rgba(28, 28, 31, 0.9); border: 1px solid var(--border); width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="pride-strip"></div>
    <header>
        <div class="brand">🌵 SUZAN'S SECURITY</div>
        <div style="display:flex; align-items:center; gap:12px;">
            <span id="userGreeting" style="font-size: 0.9rem; color: var(--teal-primary); font-weight: 600;"></span>
            <button class="menu-btn" onclick="window.toggleDrawer()">☰</button>
        </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay" onclick="window.toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <h3 style="color: var(--teal-primary); margin-bottom: 25px; font-size: 1.2rem;">Command Center</h3>
        <button class="nav-item active" onclick="window.switchView('eventsFeed')">🗓️ Event Feed</button>
        <button class="nav-item" onclick="window.switchView('teamChatView')">💬 Global Comms</button>
        <button class="nav-item" onclick="window.switchView('blockListView')" style="color: var(--danger);">🚫 Block List</button>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
        <button class="nav-item" style="color: var(--sunset-magenta);" onclick="window.promptAdminPin()">🔒 Admin Console</button>
        <button class="nav-item" style="color: var(--danger); margin-top: auto;" onclick="window.logout()">🚪 Sign Out</button>
    </div>

    <div class="container">
        <!-- USER EVENTS -->
        <section id="eventsFeedView">
            <h2 style="margin-bottom: 20px; font-weight: 800; font-size: 1.8rem;">Live Deployments</h2>
            <div id="userEventsFeedList"></div>
        </section>

        <!-- ADMIN CONSOLE -->
        <section id="adminConsoleView" style="display: none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="color:var(--sunset-magenta); font-weight:800;">Admin Console</h2>
                <button class="btn btn-sm btn-outline" onclick="window.switchView('eventsFeed')">Exit</button>
            </div>
            <div class="admin-nav">
                <button class="admin-tab active" onclick="window.switchAdmin('adminEvents')">Events</button>
                <button class="admin-tab" onclick="window.switchAdmin('adminUsers')">Guards</button>
            </div>
            <div id="adminEvents" class="admin-pane">
                <button class="btn btn-sm" style="margin-bottom:20px; width:100%;" onclick="window.addBlankEvent()">+ Create New Deployment</button>
                <div id="adminEventsList"></div>
            </div>
            <div id="adminUsers" class="admin-pane" style="display:none;">
                <div id="adminUsersList" style="background:var(--bg-card); border-radius:12px; padding:15px; border:1px solid var(--border);"></div>
            </div>
        </section>
    </div>

    <!-- AUTHENTICATION MODAL -->
    <div class="modal" id="authModal">
        <div class="modal-card">
            <h2 style="text-align:center; color:var(--teal-primary); margin-bottom:20px; font-weight:800;">STAFF LOGIN</h2>
            <input type="email" id="authEmail" class="input" placeholder="Email Address">
            <input type="password" id="authPass" class="input" placeholder="Password">
            <div id="regFields" style="display:none;">
                <input type="text" id="authName" class="input" placeholder="Full Name / Callsign">
            </div>
            <button class="btn" style="width:100%; margin-top:10px;" id="authBtn" onclick="window.handleAuth()">Acknowledge</button>
            <p style="text-align:center; margin-top:20px; color:var(--text-muted); font-size:0.9rem; cursor:pointer;" onclick="window.toggleAuth()">Need clearance? <span style="color:var(--sunset-magenta);">Register</span></p>
        </div>
    </div>

    <!-- FIREBASE INTEGRATION ENGINE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // YOUR CONFIGURATION KEYS
        const firebaseConfig = {
            apiKey: "AIzaSyCeM8RGdRFEu8eEWvEOqEgjUAm3_mXOCWk",
            authDomain: "suzans-security-app.firebaseapp.com",
            projectId: "suzans-security-app",
            storageBucket: "suzans-security-app.firebasestorage.app",
            messagingSenderId: "754272810044",
            appId: "1:754272810044:web:cbcabb5e7431aa052c7f39"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global State & Core Logic
        window.ss_state = { events: [], users: [] };
        let activeView = 'eventsFeed';
        let isReg = false;

        window.currUser = () => JSON.parse(localStorage.getItem('ss_session'));

        // Real-Time Listeners
        onSnapshot(collection(db, "events"), (snap) => {
            window.ss_state.events = snap.docs.map(d => d.data());
            window.refreshUI();
        });
        onSnapshot(collection(db, "users"), (snap) => {
            window.ss_state.users = snap.docs.map(d => d.data());
            window.checkAuth();
        });

        // Firebase Write Wrappers
        window.saveDB = async (col, data) => await setDoc(doc(db, col, data.id), data);
        window.delDB = async (col, id) => await deleteDoc(doc(db, col, id));

        // UI Routing
        window.refreshUI = () => {
            if(activeView === 'eventsFeed') window.renderEvents();
            if(activeView === 'adminConsoleView') window.renderAdminEv();
        };

        window.switchView = (v) => {
            activeView = v + (v.endsWith('View') ? '' : 'View');
            ['eventsFeedView', 'adminConsoleView'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.style.display = id === activeView ? 'block' : 'none';
            });
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').style.display = 'none';
            window.refreshUI();
        };

        window.toggleDrawer = () => {
            const d = document.getElementById('drawer');
            const o = document.getElementById('drawerOverlay');
            const isOpen = d.classList.toggle('open');
            o.style.display = isOpen ? 'block' : 'none';
        };

        // Authentication Logic
        window.checkAuth = () => {
            const u = window.currUser();
            if(!u) {
                document.getElementById('authModal').style.display = 'flex';
            } else {
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('userGreeting').innerText = `🛡️ ${u.name}`;
                window.refreshUI();
            }
        };

        window.toggleAuth = () => {
            isReg = !isReg;
            document.getElementById('regFields').style.display = isReg ? 'block' : 'none';
            document.getElementById('authBtn').innerText = isReg ? 'Create Identity' : 'Acknowledge';
        };

        window.handleAuth = async () => {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            if(!email || !pass) return alert('Email and password required.');

            if(isReg) {
                const name = document.getElementById('authName').value.trim();
                const nu = { id: 'u'+Date.now(), name, email, password: pass, isAdmin: false };
                await window.saveDB('users', nu);
                localStorage.setItem('ss_session', JSON.stringify(nu));
            } else {
                const u = window.ss_state.users.find(x => x.email === email && x.password === pass);
                if(u) {
                    localStorage.setItem('ss_session', JSON.stringify(u));
                } else {
                    return alert('Clearance denied. Invalid credentials.');
                }
            }
            window.checkAuth();
        };

        window.logout = () => {
            localStorage.removeItem('ss_session');
            location.reload();
        };

        // Events Feed Logic
        window.renderEvents = () => {
            const evs = window.ss_state.events.sort((a,b) => new Date(a.date) - new Date(b.date));
            const u = window.currUser();
            if(!u) return;

            document.getElementById('userEventsFeedList').innerHTML = evs.map(e => {
                const isSignedUp = e.guards && e.guards.includes(u.name);
                const isFull = e.openSlots <= 0;
                return `
                <div class="event-tile">
                    <img src="${e.image || 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600'}" class="event-img">
                    <div class="event-body">
                        <h3 style="color:var(--teal-primary); font-size:1.4rem; font-weight:800; margin-bottom:5px;">${e.title}</h3>
                        <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:12px; font-weight:600;">🗓️ ${e.date}</p>
                        <div style="margin-bottom:15px;">${(e.tags||[]).map(t=>`<span class="tag-badge tag-sel">${t}</span>`).join('')}</div>
                        <p style="margin-bottom:15px; font-size:0.95rem; line-height:1.4;">${e.desc}</p>
                        <div style="background:rgba(0,0,0,0.5); padding:12px; border-radius:10px; margin-bottom:15px; font-size:0.9rem; border:1px solid var(--border);">
                            <strong style="color:var(--sunset-magenta);">Roster (${e.openSlots} Open):</strong><br>
                            <span style="color:var(--text-main);">${(e.guards||[]).join(', ') || 'Awaiting deployment...'}</span>
                        </div>
                        <button class="btn" style="width:100%; ${isSignedUp ? 'background:var(--sunset-magenta); color:white;' : ''}" 
                            onclick="window.toggleSignUp('${e.id}')" ${isFull && !isSignedUp ? 'disabled' : ''}>
                            ${isSignedUp ? 'ABORT DEPLOYMENT' : (isFull ? 'ROSTER FULL' : 'CLAIM POST')}
                        </button>
                    </div>
                </div>
            `}).join('') || '<p style="text-align:center; color:var(--text-muted);">No active deployments.</p>';
        };

        window.toggleSignUp = async (id) => {
            let e = window.ss_state.events.find(x => x.id === id);
            let u = window.currUser();
            if(!e || !u) return;

            e.guards = e.guards || [];
            if(e.guards.includes(u.name)) {
                e.guards = e.guards.filter(g => g !== u.name);
                e.openSlots++;
            } else {
                e.guards.push(u.name);
                e.openSlots--;
            }
            await window.saveDB('events', e);
        };

        // Admin Console Logic
        window.promptAdminPin = () => {
            if(prompt('Enter Command PIN (Default 0000):') === '0000') window.switchView('adminConsoleView');
            else alert('Access Denied.');
        };

        window.switchAdmin = (t) => {
            document.querySelectorAll('.admin-tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.querySelectorAll('.admin-pane').forEach(el => el.style.display = 'none');
            document.getElementById(t).style.display = 'block';
            if(t === 'adminEvents') window.renderAdminEv();
        };

        window.addBlankEvent = async () => {
            const newEv = {
                id: 'e' + Date.now(),
                title: 'New Neon Event',
                date: new Date().toISOString().split('T')[0],
                desc: 'Enter briefing details here...',
                tags: ['Club'],
                openSlots: 2,
                guards: [],
                image: 'https://images.unsplash.com/photo-1542204165-65bf26472b9b?w=600'
            };
            await window.saveDB('events', newEv);
        };

        window.renderAdminEv = () => {
            const evs = window.ss_state.events.sort((a,b) => new Date(a.date) - new Date(b.date));
            document.getElementById('adminEventsList').innerHTML = evs.map(e => `
                <div style="background:var(--bg-card); padding:20px; border-radius:16px; border:1px solid var(--border); margin-bottom:15px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <span style="color:var(--teal-primary); font-weight:800; font-size:1.1rem;">${e.title}</span>
                        <button class="btn btn-sm btn-danger" onclick="window.delDB('events', '${e.id}')">Delete</button>
                    </div>
                    <input class="input" value="${e.title}" placeholder="Event Title" onchange="window.updEv('${e.id}', 'title', this.value)">
                    <input type="date" class="input" value="${e.date}" onchange="window.updEv('${e.id}', 'date', this.value)">
                    <textarea class="input" onchange="window.updEv('${e.id}', 'desc', this.value)">${e.desc}</textarea>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.85rem; color:var(--text-muted);">Open Slots:</span>
                        <input type="number" class="input" style="width:80px; margin:0;" value="${e.openSlots}" onchange="window.updEv('${e.id}', 'openSlots', parseInt(this.value)||0)">
                    </div>
                </div>
            `).join('');
        };

        window.updEv = async (id, field, val) => {
            let e = window.ss_state.events.find(x => x.id === id);
            if(e) {
                e[field] = val;
                await window.saveDB('events', e);
            }
        };
    </script>
</body>
</html>
